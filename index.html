<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Music Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="player-app">
      <header class="top-bar">
        <div>
          <h1>Offline Music Player</h1>
          <p>Load songs from your device and listen without internet.</p>
        </div>
        <label class="file-picker">
          Add Songs
          <input id="fileInput" type="file" accept="audio/*" multiple />
        </label>
      </header>

      <section class="now-playing card">
        <p class="label">Now Playing</p>
        <h2 id="trackTitle">No track selected</h2>
        <p id="trackMeta">Add songs to get started.</p>

        <audio id="audio" preload="metadata"></audio>

        <div class="controls">
          <button id="prevBtn" aria-label="Previous track">⏮</button>
          <button id="playBtn" aria-label="Play or pause">▶</button>
          <button id="nextBtn" aria-label="Next track">⏭</button>
        </div>

        <div class="seek-row">
          <span id="currentTime">0:00</span>
          <input id="seekBar" type="range" value="0" min="0" max="100" />
          <span id="duration">0:00</span>
        </div>

        <div class="volume-row">
          <span>🔉</span>
          <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.8" />
          <span>🔊</span>
        </div>
      </section>

      <section class="library card">
        <div class="library-head">
          <h3>Library</h3>
          <button id="clearBtn" class="danger">Clear Library</button>
        </div>
        <ul id="trackList"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
